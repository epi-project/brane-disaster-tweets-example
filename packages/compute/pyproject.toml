[project]
name = "compute"
version = "0.1.0"
description = "Exposes utilities for preprocessing data, training a classifier, and generating a valid submission file for the Kaggle challenge 'Natural Language Processing with Disaster Tweets'."
readme = "../README.md"
requires-python = "~=3.14.0"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "nltk",
    "tqdm",
    "xgboost",
    "pyyaml",
]
