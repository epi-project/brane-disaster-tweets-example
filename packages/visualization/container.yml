name: visualization
version: 1.0.0
kind: ecu # Executable Code Unit

description: ""

contributors:
  - Andrea Marino <am.marinoandrea@gmail.com>
  - Jingye Wang <wangjycode@gmail.com>

dependencies:
  - python3
  - python3-yaml

install:
  - apt update && apt upgrade -y
  - apt install -y pipx
  - pipx install uv

files:
  - pyproject.toml
  - uv.lock
  - __init__.py
  - run.py
  - visualization.py
  - start.bash
  - result.html

unpack:
  - # This sync needs to be done during the unpack stage as the files are not available during install
  - pipx run uv sync

entrypoint:
  kind: task
  exec: start.bash


actions:
  visualization_action:
    command:
      capture: marked
      args:
        - visualization_action
    input:
      - type: IntermediateResult
        name: filepath_train_dataset
      - type: IntermediateResult
        name: filepath_test_dataset
      - type: IntermediateResult
        name: filepath_sub_dataset
    output:
      - type: IntermediateResult
        name: output

  generate_prediction_plot:
    command:
      capture: marked
      args:
        - generate_prediction_plot
    input:
      - type: IntermediateResult
        name: filepath_test_dataset
      - type: IntermediateResult
        name: filepath_sub_dataset
    output:
      - type: IntermediateResult
        name: output


  generate_location_profile:
    command:
      capture: marked
      args:
        - generate_location_profile
    input:
      - type: IntermediateResult
        name: filepath_dataset
      - type: integer
        name: n_top
    output:
      - type: IntermediateResult
        name: output

  generate_tweets_profile:
    command:
      capture: marked
      args:
        - generate_tweets_profile
    input:
      - type: IntermediateResult
        name: filepath_dataset
      - type: integer
        name: n_top
    output:
      - type: IntermediateResult
        name: output

  generate_keywords_profile:
    command:
      capture: marked
      args:
        - generate_keywords_profile
    input:
      - type: IntermediateResult
        name: filepath_dataset
      - type: integer
        name: n_top
    output:
      - type: IntermediateResult
        name: output

  plot_bigrams_distribution:
    command:
      capture: marked
      args:
        - plot_bigrams_distribution
    input:
      - type: IntermediateResult
        name: filepath_dataset
      - type: integer
        name: n_top_bigrams
    output:
      - type: IntermediateResult
        name: filepath_image
